defaults:
  - _default
  - _self_

hydra:
  job:
    name: test
  sweeper:
    params:
      seed: 42
      dataset: dag_asia, celeba
      model: blackbox, blackbox_task
      loss: standard

dataset:
  datamodule:
    batch_size: 2048

model:
  model_cls:
    optim_kwargs:
      lr: 0.01
  latent_encoder:
    _target_: torch_concepts.nn.MLP
    hidden_size: 128
    n_layers: 3
    activation: leaky_relu
    dropout: 0.1

metrics:
  summary: false
  per_concept: true #${dataset.default_task_names}

trainer:
  # logger: wandb
  max_epochs: 200
  patience: 20

matmul_precision: medium

notes: test_blackbox