# =============================================================
# Train a Concept Bottleneck Generative Model.
#
# Sweeps both image datasets (colormnist, celeba) x the concept
# weight `alpha` x the KL weight -- 2*3*4 = 24 jobs -- in one multirun:
#
#   cd conceptarium
#   python run_experiment.py --config-name cbgm -m \
#       trainer.accelerator=gpu trainer.devices=1
#
# That is a lot; restrict any axis on the command line, e.g.
# `dataset=colormnist alpha=100` leaves the 4 kl values
# (a single value on every axis drops -m).
#
# Then produce the generation / steering / counterfactual figures:
#   python run_generative_analysis.py
#
# CelebA has 40 concepts, hence 40 steering figures — pick a few:
#   python run_generative_analysis.py \
#       steer_concepts="[Smiling,Male,Eyeglasses]"
#
# Requires `pyro-ppl` (VariationalInference), which is not in the
# conceptarium environment files.
#
# Checkpoints predating the binary two-embedding fix or the Gaussian
# observation below will NOT load — those shapes changed. Retrain.
# =============================================================
defaults:
  - _default
  - override /model: cbgm
  - override /loss: cbgm
  - override /dataset: colormnist
  - _self_

hydra:
  job:
    name: cbgm
  sweeper:
    params:
      dataset: colormnist, celeba
      alpha: 50, 100, 400
      # Brackets the reference's effective weight (~0.31, see `kl` below) as
      # well as the value the earlier sweep assumed.
      kl: 0.3, 1, 3, 10

seed: 42

# Loss weights as named keys, sweepable without restating the whole
# `loss.weights` list -- e.g. `-m alpha=1,5,10 kl=0.5,1`. Order is fixed
# by conf/loss/cbgm.yaml's `terms`; the numbers match its defaults.
recon: 1.0    # -log p(input | bottleneck)
# Not 1.0: with a Gaussian likelihood the reconstruction gradient carries a
# 1/sigma^2 factor, so at the model config's fixed sigma=0.3 it outweighs the KL
# on the encoder. beta=1 is only the true ELBO when sigma is the real noise
# level; here it left q(z|x) free to drift off the prior.
#
# CAUTION, this is NOT the reference's 10. The reference computes
#   prior_loss = (-0.5 * sum(1 + logvar - mean^2 - exp(logvar))) / numel(mean) * 10
# i.e. it divides the KL by (batch x latent_size) before scaling, while
# KLDivergenceLoss here sums the event and averages only the batch. In this
# convention the reference's weight is 10 / latent_size = 10/32 ~= 0.31, so the
# earlier sweep around 10 was anchored ~32x too high. The reference's
# reconstruction is also a MEAN over discriminator features, not a sum over
# pixels, so neither term is directly comparable -- treat 0.31 as a landmark to
# bracket, not a target.
#
# Also note the recon:KL ratios quoted below assume D=2352 pixels carry signal.
# On colormnist they do not: `colorize` writes the intensity into ONE RGB
# channel, so 1568 of those dims are identically zero and most of the rest are
# background. The true ratio is milder than the arithmetic suggests.
kl: 10.0      # KL( q(z|input) || p(z) )
# Not the reference's 5.0. Under `soft_mixing` the concepts are not teacher-forced,
# so a concept is only predictable if q(z|x) encoded it -- and it is RECONSTRUCTION
# that decides what z encodes. That term sums over D pixels and carries the same
# 1/sigma^2 factor, so at alpha=5 it outweighs concept supervision 81:1 on the
# encoder (measured at init, D=2352, sigma=0.3).
#
# The cost falls on whichever concept contributes least to pixel MSE. On a
# colormnist-shaped toy, color (a global tint, which reconstruction encodes for
# free) held 0.999 at every setting while the 10-way digit went
#   alpha 5 -> 0.103 (chance)   100 -> 0.972   1000 -> 0.997
# Equalising the two gradients at init needs ~400; the sweep above brackets that.
alpha: 100.0  # concept supervision  (reference ALPHA)
beta: 1.0     # orthogonality        (reference BETA)

loss:
  weights:   # block style: `[${recon}, ...]` is a YAML flow-sequence parse error
    - ${recon}
    - ${kl}
    - ${alpha}
    - ${beta}

# MUST stay false: precomputing embeddings replaces the pixels in the
# dataset with backbone features, which destroys the reconstruction
# target. The backbone still runs live, once per step, as the guide's
# shared trunk.
precompute_embeddings: False
force_precompute: False

dataset:
  datamodule:
    batch_size: 256

trainer:
  max_epochs: 50
  monitor: "val_loss"
  patience: 10
  accelerator: "auto"
  logger: null       # null / wandb
  log_model: false

  # Ramp the KL weight 0 -> `kl` over the first 5 epochs. At full strength from
  # step 0 the KL is trivially minimised by ignoring the input: the guide matches
  # the prior, z carries nothing, and the decoder settles on the data mean before
  # reconstruction has taught it anything. Dimensions lost that way rarely come
  # back, and the run still reports a respectable val_loss.
  callbacks:
    - _target_: "torch_concepts.nn.LossWeightWarmup"
      term: KLDivergenceLoss
      epochs: 5

matmul_precision: medium

# false so the run is written to runs.csv; run_generative_analysis.py
# discovers the trained model through that registry.
debug: false
notes: cbgm
