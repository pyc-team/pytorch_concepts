# =============================================================
# A list of loss terms, summed with weight 1.0 each by the
# learner. Terms needing `annotations` get it injected by
# run_experiment.py. For per-term weights, use a CompositeLoss
# with its own `weights:` instead (see conf/loss/cbvae.yaml).
# =============================================================
- _target_: "torch_concepts.nn.WeightedConceptLoss"
  concept_weight: 10 # weight applied to concepts
  task_weight: 1 # weight applied to tasks
  task_names: ${dataset.default_task_names}
  binary:
    _target_: "torch.nn.BCEWithLogitsLoss"
  categorical: 
    _target_: "torch.nn.CrossEntropyLoss"
  continuous:
    _target_: "torch.nn.MSELoss"

- _target_: 'torch_concepts.nn.L1LogitRegularizer'
  scale: 0.1
