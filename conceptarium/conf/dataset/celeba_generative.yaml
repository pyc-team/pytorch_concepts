# =============================================================
# CelebA prepared for generative modelling.
#
# Separate from `celeba.yaml` so the discriminative models keep
# their resnet50 + native resolution. Two differences:
#
#   image_size    native CelebA is 3x218x178 = 116,412 pixels,
#                 which no decoder should have to emit. Centre-
#                 cropped and resized to 64x64 = 12,288.
#   concept_subset  40 attributes x embedding_size is an enormous
#                 bottleneck; a handful of visually obvious ones
#                 make the steering figures legible.
#
# NOTE: `max_samples` does not work for CelebA (input_data is a
# list of filenames, not a tensor). Subsample with a splitter.
# =============================================================
defaults:
  - _commons
  - _self_

name: celeba

datamodule:
  _target_: torch_concepts.data.datamodules.celeba.CelebADataModule
  splitter:
    _target_: torch_concepts.data.splitters.native.NativeSplitter
  label_descriptions: null
  image_size: 64
  concept_subset: [Smiling, Male, Eyeglasses, Blond_Hair, Young]

default_task_names: [Smiling]

# 64 = 8 * 2**3, so three upsampling stages; base_size=8 is derived.
decoder_channels: [128, 64, 32]

backbone:
  _target_: torch_concepts.backbone.ImageBackbone
  name: resnet18
  freeze: True
