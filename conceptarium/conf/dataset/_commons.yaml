datamodule:
  batch_size: 512

  seed: ${seed}              # train/val/test split seed

  val_size: 0.1
  test_size: 0.2

  max_samples: null # if null, use all samples
  concept_subset: null # if null, use all concepts

  # Scalers fitted on the train split only. 
  # 'concepts' for *continuous* concepts
  # 'inputs' for precomputed embeddings or flat tabular features.
  scalers: null

backbone: null
