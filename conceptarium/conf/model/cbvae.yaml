# =============================================================
# Concept Bottleneck Generative Model (VAE variant).
# Mirrors examples/utilization/2_model/15.2_concept_bottleneck_vae_lightning.py.
# =============================================================
defaults:
  - _commons
  - _self_

# Filled in by update_config_from_data, not read from the dataset config,
# because a `concept_subset` shrinks `n_concepts` at runtime.
data_dims:
  input_size: ???
  n_concepts: ???

channels: 32

model_cls:
  _target_: "torch_concepts.nn.ConceptBottleneckVAE"

  latent_size: 32
  embedding_size: 16
  plate: false

  use_unknown: true # 'false' also nullify the orthogonality loss term

  # Variational for BOTH train and eval; the engine is spelled out once, and
  # `*_kwargs` is applied on top of the partial, so only the difference is set.
  inference:
    _target_: "torch_concepts.nn.VariationalInference"
    _partial_: true
    p_int: 0.0
  train_inference: ${model.model_cls.inference}
  train_inference_kwargs:
    p_int: 1.0
    initial_temperature: 1.0
    final_temperature: 0.5
    annealing: exponential
    annealing_rate: 5.0e-5

  optim_kwargs:
    lr: 0.001
  scheduler_class: null   # the example trains on a flat LR

  # DCGAN-style conv stacks for 3x28x28. This is pinned to 28x28 inputs.
  # redefine it in the sweep config if you want to change it.
  encoder:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: torch.nn.Conv2d
        in_channels: 3
        out_channels: ${model.channels}
        kernel_size: 4
        stride: 2
        padding: 1
      - _target_: torch.nn.LeakyReLU
      - _target_: torch.nn.Conv2d
        in_channels: ${model.channels}
        out_channels: ${math:"2 * ${model.channels}"}
        kernel_size: 4
        stride: 2
        padding: 1
      - _target_: torch.nn.LeakyReLU
      - _target_: torch.nn.Flatten
      - _target_: torch.nn.Linear
        in_features: ${math:"2 * ${model.channels} * 7 * 7"}
        out_features: ${model.model_cls.latent_size}

  decoder:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: torch.nn.Linear
        in_features: ${math:"(${model.data_dims.n_concepts} + (1 if ${model.model_cls.use_unknown} else 0)) * ${model.model_cls.embedding_size}"}
        out_features: ${math:"2 * ${model.channels} * 7 * 7"}
      - _target_: torch.nn.LeakyReLU
      - _target_: torch.nn.Unflatten
        dim: 1
        unflattened_size:
          - ${math:"2 * ${model.channels}"}
          - 7
          - 7
      - _target_: torch.nn.ConvTranspose2d
        in_channels: ${math:"2 * ${model.channels}"}
        out_channels: ${model.channels}
        kernel_size: 4
        stride: 2
        padding: 1
      - _target_: torch.nn.LeakyReLU
      - _target_: torch.nn.ConvTranspose2d
        in_channels: ${model.channels}
        out_channels: 3
        kernel_size: 4
        stride: 2
        padding: 1

# ConceptBottleneckVAE takes no `backbone`, which is what run_experiment.py
# passes the latent encoder as. Needs `dataset.backbone=null` too.
latent_encoder: null
