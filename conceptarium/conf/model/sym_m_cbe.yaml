# =============================================================
# Symbolic Mixture of Concept Bottleneck Experts (Sym-M-CBE).
# One fit runs the three stages: MLP experts for `mlp_epochs` epochs, then the
# experts are distilled into formulas and fine-tuned for the remaining epochs.
# =============================================================
defaults:
  - _commons
  - _self_

model_cls:
  _target_: "torch_concepts.nn.SymbolicMixtureOfConceptBottleneckExperts"
  task_names: ${dataset.default_task_names}
  n_experts: 2
  expert_hidden_size: 64
  expert_hidden_layers: 1   # 0 = linear experts (the paper's choice for classification)
  selector_hidden_layers: 1
  # Against selector collapse: weight of a term maximising the entropy of the
  # batch-average selector distribution E_x[p(m|x)] (= minimising its KL to
  # the uniform). 0 disables it.
  selector_entropy_weight: 1e-2
  # Equations already known: they are trained from
  # stage 1 and are never distilled; MLPs fill the remaining slots.
  # - Keys: task VARIABLES. Tasks with the same type and cardinality share one
  #   plate variable: "tasks" if all tasks are homogeneous, otherwise
  #   "tasks_{type}_{cardinality}" (e.g. tasks_binary_1, tasks_categorical_3).
  # - Values: one list per known expert, with one expression per output of the
  #   variable, in member order: binary -> 1 logit, categorical with K classes
  #   -> K logits, continuous -> 1 value.
  # - Symbols: the concept names (model.expert_input_names); a categorical
  #   concept has one symbol per state (Raf_0, Raf_1, ...).
  # - Only explicit numbers are trainable: 1.0*c1, not c1 (the -1 of c1 - c2 is).
  # - One selector index per sample: expert m is the m-th equation of EVERY task
  #   variable. A variable can be known while another stays MLP, but inside a
  #   variable expert m is all known or all MLP (to fix one task of a plate
  #   alone, use plate: false, where the keys are the task names).
  # e.g. single task (asia):    {tasks: [["2.0*bronc + 1.0*either"]]}
  # e.g. y1, y2 binary:         {tasks: [["1.0*c1 + 2.0*c2", "0.5*c1*c2"]]}  # [y1, y2]
  # e.g. y1, y2 binary, y3 categorical (3 classes):
  #   {tasks_binary_1: [["1.0*c1 + 2.0*c2", "0.5*c1*c2"]],
  #    tasks_categorical_3: [["1.0*c1", "1.0*c2", "-1.0*c1"]]}
  known_experts: null
  finetune_known_experts: true   # false: the constants of known_experts stay fixed

  # NOTE: the engine samples the selector: hard one-hot in training,
  # most probable expert at evaluation.
  inference:
    _target_: "torch_concepts.nn.MAPForwardInference"
    _partial_: true
  train_inference:
    _target_: "torch_concepts.nn.AncestralSamplingInference"
    _partial_: true
  train_inference_kwargs:   # Gumbel temperature 2 -> 0.05 (the paper uses a cosine decay)
    initial_temperature: 2.0
    final_temperature: 0.05
    annealing: exponential
    annealing_rate: 3.7e-4  # per optimizer step: ~10k steps to the floor

  # Stages (see the class docstring). trainer.max_epochs must exceed mlp_epochs.
  mlp_epochs: 100
  # multiplicative factor for the learning rate 
  # of the optimizer that fine-tunes the constants of the symbolic expressions.
  finetune_lr_factor: 1 
  distill_kwargs:
    target: expert        # expert (distil the MLPs, paper) | ground_truth
    max_samples: 10000     # samples per expert given to the regression
    save_path: symbolic_regression
    # PySR parameters. 
    # Below are the settings of the original paper.
    # - Regression: populations 40, population_size 60,
    #   niterations 100, ncycles_per_iteration 380, maxsize 40. 
    # - Classification: populations 40, population_size 60,
    #   niterations 100, ncycles_per_iteration 380, maxsize 40.
    # binary_operators ["+", "-", "*"], no unary operators, maxsize 5 * n_concepts.
    sr_params:
      niterations: 100
      maxsize: 40
      binary_operators: ["+", "-", "*", "/"]
      unary_operators: ["sin", "cos", "exp", "log", "tan", "tanh", "square", "cube", "sqrt", "inv"]
      model_selection: best
