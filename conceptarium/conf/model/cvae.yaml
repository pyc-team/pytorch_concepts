# =============================================================
# Conditional VAE, conditioned on the concepts.
# The baseline for conf/model/cbvae.yaml.
# =============================================================
defaults:
  - _commons
  - _self_

# Filled in by update_config_from_data, not read from the dataset config,
# because a `concept_subset` shrinks `n_concepts` at runtime.
data_dims:
  n_pixels: ???
  n_concepts: ???

model_cls:
  _target_: "torch_concepts.nn.ConditionalVAE"

  latent_size: 32
  embedding_size: 16
  plate: false

  # true makes the KL's target learnable, which opens a collapse mode: watch the
  # `kl` term, not val_loss (see the class Notes).
  conditional_prior: true

  # p(z|c)'s trunk; input width is derived from the condition, so only the
  # hidden layer needs stating. Pass `prior_encoder` for a pre-built module.
  prior_net_kwargs:
    hidden_size: 256
    activation: leaky_relu

  # Variational for BOTH train and eval; the analysis script swaps in ancestral
  # sampling. `p_int` is absent (i.e. 1.0): the concepts ARE the condition, so
  # there is no RandInt knob here.
  inference:
    _target_: "torch_concepts.nn.VariationalInference"
    _partial_: true
  train_inference: ${model.model_cls.inference}

  # Same as cbvae.yaml, so the two models' losses and FIDs are comparable.
  # `n_pixels` rather than `input_size`, which is a shape on image data. The Delta
  # observation makes the objective MSE + beta*KL, so `reconstruction_mse` is not
  # a log-likelihood.
  decoder:
    _target_: "torch_concepts.nn.MLP"
    input_size: ${math:"${model.model_cls.latent_size} + ${model.data_dims.n_concepts} * ${model.model_cls.embedding_size}"}
    output_size: ${model.data_dims.n_pixels}
    hidden_size: 256
    n_layers: 2
    activation: leaky_relu
    dropout: 0.

# Composed with the dataset's backbone by attach_latent_encoder and used as the
# guide's trunk, so `output_size` must be reachable from the backbone.
latent_encoder:
  _target_: torch_concepts.nn.MLP
  hidden_size: 256
  output_size: 128
  n_layers: 1
  activation: leaky_relu
  dropout: 0.
